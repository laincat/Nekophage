<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nekophage</title>
<style>
  :root { color-scheme: dark light; }
  html, body { margin: 0; height: 100%; background: #101012; color: #f2f2f4;
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; min-height: 0; background: #000; display: flex; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px;
    border-top: 1px solid #2a2a2e; }
  #title { flex: 1; color: #a9a9b0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #err { color: #ff8686; }
  button { background: #26262a; color: inherit; border: 1px solid #34343a;
    border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #303036; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <video id="v" controls playsinline preload="metadata"></video>
  </div>
  <div id="bar">
    <span id="title"></span>
    <span id="err"></span>
    <button id="hlsmode" class="hidden">强制 HLS.js</button>
  </div>
</div>
<script src="hls.js"></script>
<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  // The page never sees an upstream URL: src is a proxy resource path.
  const src = params.get('src') || '';
  const title = params.get('title') || '';
  const start = Number(params.get('start') || '0');
  const token = params.get('token') || '';
  const video = document.getElementById('v');
  const err = document.getElementById('err');
  const button = document.getElementById('hlsmode');
  document.getElementById('title').textContent = title;
  document.title = title || 'Nekophage';

  let hls = null;
  let forced = params.get('mode') === 'hls';
  let lastPost = 0;

  function fail(text) { err.textContent = text; }

  function post(force) {
    if (!token) return;
    const now = Date.now();
    if (!force && now - lastPost < 4000) return;
    lastPost = now;
    const body = JSON.stringify({
      time: video.currentTime || 0,
      duration: Number.isFinite(video.duration) ? video.duration : 0,
      paused: video.paused
    });
    fetch('progress', { method: 'POST', body: body, headers: { 'Content-Type': 'application/json' },
      keepalive: true }).catch(function () { /* progress is best effort */ });
  }

  function nativeHLS() {
    return video.canPlayType('application/vnd.apple.mpegurl') !== '';
  }

  function play() {
    if (!src) { fail('没有可播放的媒体地址'); return; }
    if (!forced && nativeHLS()) {
      video.src = src;
      if (start > 0) {
        video.addEventListener('loadedmetadata', function () { video.currentTime = start; }, { once: true });
      }
      video.addEventListener('error', function () { fail('这个格式在这里无法解码'); });
      return;
    }
    if (typeof Hls === 'undefined' || !Hls.isSupported()) {
      fail(nativeHLS() ? 'HLS.js 不可用' : '这个格式在这里无法解码');
      return;
    }
    hls = new Hls({ enableWorker: true, lowLatencyMode: false });
    hls.on(Hls.Events.ERROR, function (_event, data) {
      if (!data || !data.fatal) return;
      fail(data.details ? String(data.details) : '播放中断');
    });
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      if (start > 0) video.currentTime = start;
    });
  }

  // The native path is preferred where it exists (macOS); the button exposes
  // HLS.js for comparing the two decoders on the same file.
  if (nativeHLS() && !forced) {
    button.classList.remove('hidden');
    button.addEventListener('click', function () {
      forced = true; button.classList.add('hidden');
      if (hls) { hls.destroy(); hls = null; }
      video.removeAttribute('src'); video.load();
      err.textContent = '';
      play();
    });
  }

  video.addEventListener('timeupdate', function () { post(false); });
  video.addEventListener('pause', function () { post(true); });
  video.addEventListener('ended', function () { post(true); });
  window.addEventListener('beforeunload', function () { post(true); });

  // Space toggles playback, as every system player does; the controls keep
  // their own handling when they have focus.
  window.addEventListener('keydown', function (e) {
    if (e.target !== document.body || e.code !== 'Space') return;
    e.preventDefault();
    if (video.paused) video.play().catch(function () {}); else video.pause();
  });

  play();
})();
</script>
</body>
</html>
