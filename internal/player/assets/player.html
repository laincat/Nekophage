<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nekophage</title>
<style>
  :root { color-scheme: dark light; }
  html, body { margin: 0; height: 100%; background: #101012; color: #f2f2f4;
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; min-height: 0; background: #000; display: flex; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px;
    border-top: 1px solid #2a2a2e; }
  #title { flex: 1; color: #a9a9b0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #err { color: #ff8686; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <video id="v" controls playsinline preload="metadata"></video>
  </div>
  <div id="bar">
    <span id="title"></span>
    <span id="err" role="status"></span>
  </div>
</div>
<script src="hls.js"></script>
<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  // The page never sees an upstream URL: src is a proxy resource path.
  const src = params.get('src') || '';
  const title = params.get('title') || '';
  const start = Number(params.get('start') || '0');
  const token = params.get('token') || '';
  const format = params.get('format') || 'auto';
  const video = document.getElementById('v');
  const err = document.getElementById('err');
  document.getElementById('title').textContent = title;
  document.title = title || 'Nekophage';

  let hls = null;
  const forced = params.get('mode') === 'hls';
  let lastPost = 0;
  let restoring = Number.isFinite(start) && start > 0;
  const source = new URL(src, location.href);
  if (source.origin !== location.origin ||
      !source.pathname.startsWith('/s/' + token + '/media/')) {
    err.textContent = '无效的媒体地址';
    return;
  }

  // Both the native decoder and HLS.js have metadata before seeking. Setting
  // currentTime when only the manifest exists can drop the requested position.
  video.addEventListener('loadedmetadata', function () {
    if (!restoring) return;
    const end = Number.isFinite(video.duration) ? Math.max(0, video.duration - 0.01) : start;
    video.currentTime = Math.min(start, end);
  }, { once: true });
  video.addEventListener('seeked', function () { restoring = false; });
  // Whether an audio track reached the decoder. Chromium exposes no audio
  // element API, so HLS.js reports the parsed codec/tracks; WebKit can count
  // decoded audio bytes. Neither proves speakers are audible, only that the
  // pipeline saw and handled an audio track.
  function noteAudio(fromHLS) {
    if (fromHLS) {
      const tracks = (hls && hls.audioTracks ? hls.audioTracks.length : 0);
      const codec = (hls && hls.levels && hls.levels[0] ? hls.levels[0].audioCodec : '') || '';
      video.dataset.audio = tracks > 0 || codec ? 'yes' : 'no';
      return;
    }
    video.dataset.audio = typeof video.webkitAudioDecodedByteCount === 'number'
      ? (video.webkitAudioDecodedByteCount > 0 ? 'yes' : 'no') : 'unknown';
  }

  function fail(text) { err.textContent = text; }

  function post(force) {
    if (!token || restoring || !video.videoWidth) return;
    const now = Date.now();
    if (!force && now - lastPost < 4000) return;
    lastPost = now;
    const body = JSON.stringify({
      time: video.currentTime || 0,
      duration: Number.isFinite(video.duration) ? video.duration : 0,
      paused: video.paused
    });
    fetch('progress', { method: 'POST', body: body, headers: { 'Content-Type': 'application/json' },
      keepalive: true }).catch(function () { /* progress is best effort */ });
  }

  function nativeHLS() {
    return video.canPlayType('application/vnd.apple.mpegurl') !== '';
  }

  function play() {
    if (!src) { fail('没有可播放的媒体地址'); return; }
    if (format !== 'hls' || (!forced && nativeHLS())) {
      video.dataset.decoder = 'native';
      video.src = source.href;
      video.addEventListener('error', function () { fail('这个格式在这里无法解码'); });
      video.addEventListener('loadedmetadata', function () { noteAudio(false); }, { once: true });
      return;
    }
    if (typeof Hls === 'undefined' || !Hls.isSupported()) {
      fail(nativeHLS() ? 'HLS.js 不可用' : '这个格式在这里无法解码');
      return;
    }
    video.dataset.decoder = 'hls.js';
    hls = new Hls({ enableWorker: true, lowLatencyMode: false, startPosition: restoring ? start : -1 });
    hls.on(Hls.Events.ERROR, function (_event, data) {
      if (!data || !data.fatal) return;
      fail(data.details ? String(data.details) : '播放中断');
    });
    hls.loadSource(source.href);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () { noteAudio(true); });
  }

  video.addEventListener('timeupdate', function () { post(false); });
  video.addEventListener('pause', function () { post(true); });
  video.addEventListener('ended', function () { post(true); });
  window.addEventListener('beforeunload', function () { post(true); });

  // Space toggles playback, as every system player does; the controls keep
  // their own handling when they have focus.
  window.addEventListener('keydown', function (e) {
    if (e.target !== document.body || e.code !== 'Space') return;
    e.preventDefault();
    if (video.paused) video.play().catch(function () {}); else video.pause();
  });

  play();
})();
</script>
</body>
</html>
