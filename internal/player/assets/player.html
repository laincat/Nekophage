<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nekophage</title>
<style>
  :root { color-scheme: dark light; }
  html, body { margin: 0; height: 100%; background: #101012; color: #f2f2f4;
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; min-height: 0; background: #000; display: flex; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px;
    border-top: 1px solid #2a2a2e; }
  #title { flex: 1; min-width: 0; color: #a9a9b0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subtitle-choice { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #subtitle-choice[hidden] { display: none; }
  #subtitles { max-width: min(13em, 35vw); font: inherit; }
  #err { color: #ff8686; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <video id="v" controls playsinline preload="metadata"></video>
  </div>
  <div id="bar">
    <span id="title"></span>
    <label id="subtitle-choice" hidden>字幕
      <select id="subtitles" aria-label="字幕"><option value="-1">关闭</option></select>
    </label>
    <span id="err" role="status"></span>
  </div>
</div>
<script src="hls.js"></script>
<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  // The page never sees an upstream URL: src is a proxy resource path.
  const src = params.get('src') || '';
  const title = params.get('title') || '';
  const start = Number(params.get('start') || '0');
  const token = params.get('token') || '';
  const format = params.get('format') || 'auto';
  const video = document.getElementById('v');
  const err = document.getElementById('err');
  document.getElementById('title').textContent = title;
  document.title = title || 'Nekophage';

  let hls = null;
  const subtitleSelect = document.getElementById('subtitles');
  const subtitleLabel = document.getElementById('subtitle-choice');
  // null follows the manifest/browser default; false remembers an explicit
  // "off" choice even when HLS refreshes its list of tracks.
  let subtitleChoice = null;
  function trackName(track) { return track.name || track.label || track.lang || track.language || ''; }
  function trackLanguage(track) { return track.lang || track.language || ''; }
  // The list the select was built from. An option's value is its position in
  // this list, which is not the same as an HLS track id: HLS.js discovers
  // groups in its own order, and the native element lists them in manifest
  // order. Mapping through the list is what keeps "English" meaning English.
  let subtitleTrackList = [];
  function subtitleOptions(tracks, selected) {
    subtitleTrackList = Array.from(tracks);
    subtitleSelect.replaceChildren(new Option('关闭', '-1'));
    subtitleTrackList.forEach(function (track, i) {
      subtitleSelect.add(new Option(trackName(track) || ('字幕 ' + (i + 1)), String(i)));
    });
    subtitleLabel.hidden = subtitleTrackList.length === 0;
    subtitleSelect.value = String(selected);
  }
  // The default with no saved choice follows the system's language order, the
  // way the iOS client does: a manifest's DEFAULT=YES is the provider's guess
  // for everyone, the system language is the viewer's own. Chinese keeps its
  // script (a Traditional reader is not given Simplified) and infers it from
  // the region; an unscripted "zh" on either side is still accepted.
  function normaliseLanguage(tag) {
    const parts = String(tag || '').replace(/_/g, '-').split('-').filter(Boolean);
    if (!parts.length) return '';
    const base = parts[0].toLowerCase();
    if (base !== 'zh') return base;
    const rest = parts.slice(1).map(function (p) { return p.toLowerCase(); });
    if (rest.indexOf('hant') >= 0) return 'zh-hant';
    if (rest.indexOf('hans') >= 0) return 'zh-hans';
    if (rest.some(function (p) { return p === 'tw' || p === 'hk' || p === 'mo'; })) return 'zh-hant';
    return rest.length ? 'zh-hans' : 'zh';
  }
  function languageMatches(have, wanted) {
    if (!have || !wanted) return false;
    if (have === wanted) return true;
    const a = have.split('-')[0], b = wanted.split('-')[0];
    if (a !== b) return false;
    return a !== 'zh' || have === 'zh' || wanted === 'zh';
  }
  // The app passes the system's own list; the WebView's navigator.languages
  // is the app's interface language and only a fallback.
  const passedLanguages = (params.get('langs') || '').split(',').filter(Boolean);
  function systemLanguages() {
    const seen = new Set();
    const list = passedLanguages.length ? passedLanguages
      : (navigator.languages && navigator.languages.length) ? navigator.languages
      : [navigator.language || ''];
    return Array.from(list).map(normaliseLanguage).filter(function (tag) {
      if (!tag || seen.has(tag)) return false;
      seen.add(tag);
      return true;
    });
  }
  function systemSubtitle(tracks) {
    const list = Array.from(tracks);
    const wanted = systemLanguages();
    for (let w = 0; w < wanted.length; w++) {
      const i = list.findIndex(function (track) {
        return languageMatches(normaliseLanguage(trackLanguage(track)), wanted[w]);
      });
      if (i >= 0) return i;
    }
    return list.findIndex(function (track) { return track.default; });
  }
  function chosenSubtitle(tracks) {
    if (subtitleChoice === false) return -1;
    if (subtitleChoice === null) return systemSubtitle(tracks);
    return Array.from(tracks).findIndex(function (track) {
      return trackName(track) === subtitleChoice.name && trackLanguage(track) === subtitleChoice.language;
    });
  }
  function updateHLSSubtitles() {
    const tracks = hls.subtitleTracks || [];
    const index = chosenSubtitle(tracks);
    const track = index >= 0 ? tracks[index] : null;
    // subtitleTrack is a track id, not a position: passing the position picks
    // whatever happens to have that id.
    hls.subtitleTrack = track && track.id !== undefined ? track.id : -1;
    hls.subtitleDisplay = !!track;
    subtitleOptions(tracks, index);
  }
  function updateNativeSubtitles() {
    if (hls) return;
    const tracks = Array.from(video.textTracks);
    // With no saved choice the system language decides here too, so a sidecar
    // track list and an HLS one start the same way.
    const index = chosenSubtitle(tracks);
    tracks.forEach(function (track, i) {
      const mode = i === index ? 'showing' : 'disabled';
      if (track.mode !== mode) track.mode = mode;
    });
    subtitleOptions(tracks, index);
  }
  subtitleSelect.addEventListener('change', function () {
    const track = subtitleTrackList[Number(subtitleSelect.value)];
    subtitleTouched = true;
    subtitleChoice = track ? { name: trackName(track), language: trackLanguage(track) } : false;
    if (hls) updateHLSSubtitles(); else updateNativeSubtitles();
    rememberSubtitle(track ? { name: trackName(track), language: trackLanguage(track) } : { off: true });
  });

  // The choice outlives the page: it is stored with the episode's position, so
  // reopening the episode does not fall back to the manifest default. Indexes
  // are not stored — a provider may reorder tracks between plays, so the choice
  // is remembered as name + language and matched again when the list arrives.
  let subtitleTouched = false;
  function rememberSubtitle(choice) {
    if (!token) return;
    const body = JSON.stringify(choice);
    fetch('subtitle', { method: 'POST', body: body,
      headers: { 'Content-Type': 'application/json' }, keepalive: true })
      .catch(function () { /* the choice is best effort, like progress */ });
  }
  function applySavedSubtitle() {
    if (!token) return;
    fetch('subtitle', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (saved) {
        // A click that lands while this request is in flight wins: the viewer
        // saw the list before the answer arrived.
        if (!saved || !saved.chosen || subtitleTouched) return;
        subtitleChoice = saved.off ? false : { name: saved.name || '', language: saved.language || '' };
        if (hls) updateHLSSubtitles(); else updateNativeSubtitles();
      })
      .catch(function () { /* no saved choice: follow the default */ });
  }
  video.textTracks.addEventListener('addtrack', function () {
    // WebKit can disable a newly added track after HLS picked it. Reapply the
    // existing choice once the native track exists, including an explicit off.
    if (hls) queueMicrotask(updateHLSSubtitles); else updateNativeSubtitles();
  });
  video.textTracks.addEventListener('change', updateNativeSubtitles);
  const forced = params.get('mode') || '';
  let lastPost = 0;
  let restoring = Number.isFinite(start) && start > 0;
  const source = new URL(src, location.href);
  if (source.origin !== location.origin ||
      !source.pathname.startsWith('/s/' + token + '/media/')) {
    err.textContent = '无效的媒体地址';
    return;
  }

  // Both the native decoder and HLS.js have metadata before seeking. Setting
  // currentTime when only the manifest exists can drop the requested position.
  video.addEventListener('loadedmetadata', function () {
    if (!restoring) return;
    const end = Number.isFinite(video.duration) ? Math.max(0, video.duration - 0.01) : start;
    video.currentTime = Math.min(start, end);
  }, { once: true });
  video.addEventListener('seeked', function () { restoring = false; });
  // Manifest metadata is only a declaration, not evidence of decoding. Keep
  // this diagnostic separate from webkitAudioDecodedByteCount, which the
  // development probe samples after playback has actually advanced.
  function noteAudio(fromHLS) {
    if (fromHLS) {
      const tracks = (hls && hls.audioTracks ? hls.audioTracks.length : 0);
      const codec = (hls && hls.levels && hls.levels[0] ? hls.levels[0].audioCodec : '') || '';
      video.dataset.audioDeclared = tracks > 0 || codec ? 'yes' : 'no';
      return;
    }
    video.dataset.audioDeclared = 'unknown';
  }

  function fail(text) { err.textContent = text; }

  function post(force) {
    if (!token || restoring || !video.videoWidth) return;
    const now = Date.now();
    if (!force && now - lastPost < 4000) return;
    lastPost = now;
    const body = JSON.stringify({
      time: video.currentTime || 0,
      duration: Number.isFinite(video.duration) ? video.duration : 0,
      paused: video.paused
    });
    fetch('progress', { method: 'POST', body: body, headers: { 'Content-Type': 'application/json' },
      keepalive: true }).catch(function () { /* progress is best effort */ });
  }

  function play() {
    if (!src) { fail('没有可播放的媒体地址'); return; }
    // Native HLS is not preferred. WebView2's native path ignores EXT-X-MEDIA
    // subtitle groups, so the same source played with or without subtitles
    // depending on the engine. The bundled HLS.js covers both; native remains
    // only as a fallback when HLS.js cannot run here.
    // `mode=native` exists so the fallback can still be exercised by the probe.
    const useHLS = format === 'hls' && forced !== 'native' &&
      typeof Hls !== 'undefined' && Hls.isSupported();
    if (!useHLS) {
      video.dataset.decoder = 'native';
      video.src = source.href;
      video.addEventListener('error', function () { fail('这个格式在这里无法解码'); });
      video.addEventListener('loadedmetadata', function () { noteAudio(false); }, { once: true });
      return;
    }
    video.dataset.decoder = 'hls.js';
    hls = new Hls({ enableWorker: true, lowLatencyMode: false, startPosition: restoring ? start : -1 });
    hls.on(Hls.Events.ERROR, function (_event, data) {
      if (!data || !data.fatal) return;
      const status = Number(data.response && data.response.code);
      if (status === 401 || status === 403) {
        fail('媒体访问被拒绝 (HTTP ' + status + ')，请检查视频源的登录状态或访问权限。');
      } else if (status >= 400 && status < 600) {
        fail('媒体请求失败 (HTTP ' + status + ')，请稍后重试。');
      } else {
        fail(data.details ? String(data.details) : '播放中断');
      }
    });
    hls.on(Hls.Events.MANIFEST_PARSED, function () { noteAudio(true); });
    hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, function () {
      // HLS.js applies its precomputed default after notifying listeners.
      // Restore our choice after that call stack, or it can be overwritten.
      queueMicrotask(updateHLSSubtitles);
    });
    hls.on(Hls.Events.SUBTITLE_TRACK_SWITCH, function () {
      // data.id is a track id; the select's values are positions in the list
      // built from subtitleTracks. Recompute instead of assuming they match.
      const tracks = hls.subtitleTracks || [];
      subtitleOptions(tracks, chosenSubtitle(tracks));
    });
    hls.loadSource(source.href);
    hls.attachMedia(video);
  }

  video.addEventListener('timeupdate', function () { post(false); });
  video.addEventListener('pause', function () { post(true); });
  video.addEventListener('ended', function () { post(true); });
  window.addEventListener('beforeunload', function () { post(true); });

  // Space toggles playback, as every system player does; the controls keep
  // their own handling when they have focus.
  window.addEventListener('keydown', function (e) {
    if (e.target !== document.body || e.code !== 'Space') return;
    e.preventDefault();
    if (video.paused) video.play().catch(function () {}); else video.pause();
  });

  applySavedSubtitle();
  play();
})();
</script>
</body>
</html>
